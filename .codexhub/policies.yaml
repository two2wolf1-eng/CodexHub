version: 1
defaults:
  readOnlyAction: allow
  writeAction: dry_run_and_approval_required
  highRiskAction: approval_required
  criticalRiskAction: approval_required
  capabilityProviderAuthority: false
  governanceCoreAuthority: true
actionModes:
  read:
    approvalRequired: false
    evidenceRequired: true
    realWriteAllowed: false
  dry-run:
    approvalRequired: false
    evidenceRequired: true
    realWriteAllowed: false
  write:
    dryRunRequired: true
    approvalRequired: true
    persistedApprovalArtifactRequired: true
    evidenceRequired: true
    auditRequired: true
  admin:
    approvalRequired: true
    persistedApprovalArtifactRequired: true
    evidenceRequired: true
    auditRequired: true
writeActions:
  local_patch_dry_run:
    mode: dry_run_only
    approvalRequired: false
    realWriteAllowed: false
  real_write:
    mode: write
    dryRunRequired: true
    approvalRequired: true
    persistedApprovalArtifactRequired: true
    evidenceRequired: true
    auditRequired: true
specialRules:
  realWriteRequiresApproval: true
  requestBodyApprovalArtifactTrusted: false
  persistedApprovalArtifactRequired: true
  externalProcessBoundaryMustBeAudited: true
  evidenceMetadataRecursiveRedaction: true
  bodyForHashOnlyStoresRawBody: false
  adapterExecuteRequiresExecutionAuthority: true
  adapterExecuteOnlyViaWorkflowKernel: true
  mcpToolsDeclareRiskActionEvidenceApproval: true
  browserActRequiresApproval: true
  electronMainInspectorRequiresApproval: true
  capabilityProviderCanGrantAuthority: false
  workspaceGovernanceNoAccountRotationOrMfaBypass: true
capabilityAdapters:
  requireManifest: true
  requireDryRunPlan: true
  requirePolicyDecision: true
  requireEvidence: true
  requireAudit: true
  executeDirectlyFromUiCliOrMcp: false
  externalProcessBoundaryRequiresAudit: true
browserAutomation:
  defaultMode: read-only
  m4aFixtureRunnerOnly: true
  realBrowserConnectionEnabledInM4a: false
  profileProbeEnabledInM4a: false
  rawProfilePathStorage: forbidden
  clickInputSubmitAllowedInFoundation: false
  screenshotRequiresApproval: true
  networkBodyStorage: forbidden
electronCdp:
  defaultMode: read-only
  mainInspectorDefault: disabled
  runtimeEvaluateDefault: forbidden
  screenshotRequiresApproval: true
blocked:
  - token_collection
  - cookie_collection
  - mfa_bypass
  - account_automation
  - permission_bypass
  - quota_bypass
  - real_browser_click_input
  - electron_main_inspector_connection
