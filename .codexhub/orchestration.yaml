version: 1
mode: foundation
defaultWorkflow: development.bootstrap
rules:
  dryRunFirst: true
  requirePolicyDecision: true
  requireEvidence: true
  requireAudit: true
  adapterExecutionOnly: true
  noNewProcessBoundaryInM2c: true
  capabilityAdapterKernelRequired: true
development:
  affectedCommand: pnpm nx affected
  qualityGate: pnpm nx run-many -t lint,test,build
workflows:
  m4_5.capability-adapter-kernel-readiness:
    risk: high
    trigger:
      type: manual
      entrypoint: packages/capability-adapter-kernel
    chain:
      - phase: manifest-validation
        package: capability-adapter-kernel
        validates:
          - CapabilityManifest
          - evidencePolicy
          - processBoundaryAudit
      - phase: dry-run-envelope-validation
        package: capability-adapter-kernel
        validates:
          - CapabilityDryRun
          - noProcessBoundaryInvoked
          - noExternalProcessStarted
          - noBodyStored
      - phase: execution-envelope-validation
        package: capability-adapter-kernel
        validates:
          - ExecutionAuthority
          - CapabilityExecutionResult
          - EvidenceRef
          - CapabilityAuditEvent
      - phase: existing-adapter-compatibility
        adapters:
          - codex-exec-adapter
          - nx-verification-adapter
          - playwright-observer-adapter
        behaviorChanges: forbidden
    forbidden:
      - newProcessBoundary
      - browserAct
      - electronCdpConnection
      - worktreeWrite
      - pullRequestCreation
  m2c.minimal-governed-orchestrator:
    risk: high
    trigger:
      type: manual
      entrypoint: apps/orchestrator
      localControlRequired: true
    chain:
      - phase: request
        model: DevelopmentRequest
      - phase: codex
        adapter: codex-exec-adapter
        authority: persistedApprovalArtifact
        input: governedFileHash
        rawBodyStorage: forbidden
      - phase: verification
        adapter: nx-verification-adapter
        authority: policyDecision
        targets:
          - lint
          - test
          - build
        rawBodyStorage: forbidden
      - phase: summary
        output: evidenceAndAuditIdsOnly
    forbidden:
      - dashboardWriteUi
      - mcpTools
      - browserAutomation
      - electronAutomation
      - worktreeCreation
      - gitPush
      - pullRequestCreation
  m4c.governed-browser-observation:
    risk: high
    trigger:
      type: manual
      entrypoint: apps/supervisor
      localControlRequired: true
    chain:
      - phase: dry-run
        route: POST /api/browser/observation/dry-runs
        adapter: playwright-observer-adapter
        rawTargetUrlStorage: forbidden
        rawProfilePathStorage: forbidden
      - phase: approval-request
        route: POST /api/browser/observation/approval-requests
        authority: supervisor-store
      - phase: manual-approval
        route: POST /api/browser/observation/manual-approvals
        authority: persistedApprovalArtifact
      - phase: execution
        route: POST /api/browser/observation/runs
        authority: persistedApprovalArtifact
        productDefaultEnabled: false
        adapterExecution: supervisor-gated
      - phase: summary
        output: hashesCountsSummariesEvidenceAndAuditIdsOnly
    readOnlyUx:
      dashboardRoute: '#/browser-profiles'
      cliCommands:
        - codexhub browser profiles list
        - codexhub browser observe --dry-run
        - codexhub browser runs list
        - codexhub browser runs show
    forbidden:
      - dashboardWriteUi
      - cliBrowserExecuteCommand
      - rawTargetUrlPersistence
      - realProfileProbe
      - screenshotCapture
      - networkBodyCapture
      - browserClickTypeSubmit
      - cookieTokenSessionStorageExtraction
  m5c.governed-electron-cdp-websocket-events:
    risk: high
    trigger:
      type: manual
      entrypoint: apps/supervisor
      localControlRequired: true
    chain:
      - phase: dry-run
        route: POST /api/electron-cdp/observation/dry-runs
        adapter: electron-cdp-adapter
        runnerMode: controlled-websocket-events
        targetHashRequired: true
        rawEndpointStorage: forbidden
        rawTargetStorage: forbidden
      - phase: approval-request
        route: POST /api/electron-cdp/observation/approval-requests
        authority: supervisor-store
      - phase: manual-approval
        route: POST /api/electron-cdp/observation/manual-approvals
        authority: persistedApprovalArtifact
      - phase: execution
        route: POST /api/electron-cdp/observation/runs
        authority: persistedApprovalArtifact
        productDefaultEnabled: false
        requiredEnv:
          - CODEXHUB_ELECTRON_CDP_OBSERVER_ENABLED
          - CODEXHUB_ELECTRON_CDP_EVENTS_ENABLED
        adapterExecution: supervisor-gated
      - phase: summary
        output: hashesCountsSummariesEvidenceAndAuditIdsOnly
    forbidden:
      - dashboardWriteUi
      - cliElectronExecuteCommand
      - rawEndpointPersistence
      - rawWebSocketUrlPersistence
      - rawEventPayloadPersistence
      - processDiscovery
      - electronImport
      - mainInspectorConnection
      - runtimeEvaluate
      - genericCdpCommandPassthrough
      - screenshotCapture
      - domSnapshotCapture
      - networkBodyCapture
      - electronClickType
  m5d.electron-cdp-read-only-ux:
    risk: medium
    trigger:
      type: manual
      entrypoint: apps/dashboard
      localControlRequired: false
    chain:
      - phase: dashboard
        route: '#/electron'
        reads:
          - GET /api/electron-cdp/observation/dry-runs
          - GET /api/electron-cdp/observation/approvals
          - GET /api/electron-cdp/observation/runs
        output: hashesCountsSummariesStatusesEvidenceAndAuditIdsOnly
      - phase: cli
        commands:
          - codexhub electron dry-runs list
          - codexhub electron approvals list
          - codexhub electron runs list
          - codexhub electron runs show
        method: GET-only
      - phase: generic-runs
        commands:
          - codexhub runs list
          - codexhub runs show
        includes: electron_cdp_observation
    forbidden:
      - dashboardWriteUi
      - cliElectronExecuteCommand
      - localControlCredentialInDashboard
      - postRequests
      - adapterExecute
      - electronCdpConnection
      - websocketRunnerStart
      - newSupervisorRoute
      - newStoreSchema
      - worktreeCreation
      - pullRequestCreation
  m5_5.electron-cdp-hardening-review:
    risk: high
    trigger:
      type: manual
      entrypoint: packages/electron-cdp-adapter
      localControlRequired: false
    chain:
      - phase: boundary-truth-review
        package: electron-cdp-adapter
        validates:
          - cdpHttpBoundaryInvokedAfterTargetListRead
          - cdpWebSocketBoundaryInvokedOnlyAfterSocketConnect
          - processBoundaryInvokedFalse
          - externalProcessStartedFalse
      - phase: supervisor-control-plane-review
        app: supervisor
        validates:
          - persistedApprovalConsumedAfterBoundaryAttempt
          - preBoundaryBlocksDoNotConsumeApproval
          - publicResponsesMetadataOnly
      - phase: governance-alignment
        files:
          - .codexhub/integrations.yaml
          - docs/integration-decisions/0005-electron-cdp-boundary.md
        validates:
          - productDefaultDisabled
          - eventsFlagRequired
          - genericCommandPassthroughForbidden
      - phase: regression-verification
        commands:
          - pnpm verify:foundation
    forbidden:
      - newSupervisorRoute
      - newProcessBoundary
      - newWebSocketBoundary
      - dashboardWriteUi
      - cliElectronExecuteCommand
      - electronMainInspector
      - runtimeEvaluate
      - genericCdpCommandPassthrough
      - screenshotCapture
      - domSnapshotCapture
      - networkBodyCapture
      - electronClickType
      - worktreeCreation
      - pullRequestCreation
  m6a.controlled-worktree-pr-draft-foundation:
    risk: high
    trigger:
      type: manual
      entrypoint: packages/orchestrator-kernel
      localControlRequired: false
    chain:
      - phase: worktree-plan
        package: worktree-manager
        defaultRoot: ../CodexHub-worktrees
        output: rootPathAndWorktreePathHashesOnly
        processBoundaryPlanned: false
      - phase: fixture-worktree-execution
        package: worktree-manager
        runnerMode: injected-fixture-only
        processBoundaryInvoked: false
        externalProcessStarted: false
      - phase: codex
        adapter: codex-exec-adapter
        runnerMode: injected-test-runner-only
        authority: existing-governed-adapter-path
      - phase: verification
        adapter: nx-verification-adapter
        runnerMode: injected-test-runner-only
        authority: existing-governed-adapter-path
      - phase: patch-summary
        output: changedFilesDiffHashCountsOnly
      - phase: pr-draft
        output: titleHashBodyHashSectionSummaryOnly
        readyRequiresVerificationPassed: true
      - phase: release-audit-draft
        output: rollbackHashRiskHashEvidenceAuditIdsOnly
    forbidden:
      - realGitWorktreeAdd
      - realGitWorktreeRemove
      - gitDiffProcess
      - gitPush
      - openPullRequest
      - rawWorktreePathPersistence
      - rawDiffPersistence
      - rawPullRequestBodyPersistence
      - dashboardWriteUi
      - cliWorktreeExecuteCommand
      - newProcessBoundary
      - noLiveAutomationAllowlistChange
  m6b.governed-worktree-control-plane:
    risk: high
    trigger:
      type: manual
      entrypoint: apps/supervisor
      localControlRequired: true
    chain:
      - phase: dry-run
        route: POST /api/worktrees/dry-runs
        adapter: worktree-manager
        runnerMode: controlled-git-worktree
        defaultRoot: ../CodexHub-worktrees
        output: pathRefCommandHashesOnly
        gitProcessBoundaryPlanned: true
      - phase: approval-request
        route: POST /api/worktrees/approval-requests
        authority: supervisor-store
      - phase: manual-approval
        route: POST /api/worktrees/manual-approvals
        authority: persistedApprovalArtifact
      - phase: execution
        route: POST /api/worktrees/runs
        authority: persistedApprovalArtifact
        productDefaultEnabled: false
        requiredEnv:
          - CODEXHUB_WORKTREE_MANAGER_ENABLED
        adapterExecution: supervisor-gated
        allowedGitBoundary:
          - rev-parse --show-toplevel
          - worktree add --detach
          - diff --name-only --no-ext-diff
          - diff --numstat --no-ext-diff
      - phase: summary
        output: hashesCountsSummariesEvidenceAndAuditIdsOnly
        cleanupRequired: true
        cleanupDeferred: true
      - phase: orchestrator-handoff
        package: orchestrator-kernel
        usesExistingAdapters:
          - codex-exec-adapter
          - nx-verification-adapter
        noNewCodexNxBoundary: true
        prDraftReadyRequiresVerificationPassed: true
    forbidden:
      - dashboardWriteUi
      - cliWorktreeExecuteCommand
      - rawWorktreePathPersistence
      - rawDiffPersistence
      - rawPullRequestBodyPersistence
      - rawGitCommandPersistence
      - arbitraryGitCommand
      - genericShell
      - gitPush
      - openPullRequest
      - worktreeRemove
      - automaticCleanupDelete
      - browserAutomation
      - electronAutomation
      - mcpWriteTool
  m6c.governed-worktree-cleanup-control-plane:
    risk: high
    trigger:
      type: manual
      entrypoint: apps/supervisor
      localControlRequired: true
    chain:
      - phase: cleanup-dry-run
        route: POST /api/worktrees/cleanup/dry-runs
        adapter: worktree-manager
        sourceRunRequired: true
        sourceRunCleanupRequired: true
        output: sourceRunAndPathHashesOnly
        gitProcessBoundaryPlanned: true
        gitProcessBoundaryInvoked: false
      - phase: cleanup-approval-request
        route: POST /api/worktrees/cleanup/approval-requests
        authority: supervisor-store
      - phase: cleanup-manual-approval
        route: POST /api/worktrees/cleanup/manual-approvals
        authority: persistedApprovalArtifact
      - phase: cleanup-execution
        route: POST /api/worktrees/cleanup/runs
        authority: persistedApprovalArtifact
        productDefaultEnabled: false
        requiredEnv:
          - CODEXHUB_WORKTREE_MANAGER_ENABLED
          - CODEXHUB_WORKTREE_CLEANUP_ENABLED
        adapterExecution: supervisor-gated
        allowedGitBoundary:
          - rev-parse --show-toplevel
          - worktree list --porcelain
          - status --porcelain --untracked-files=normal
          - worktree remove
        nonForceOnly: true
        filesystemDeleteFallbackAllowed: false
      - phase: cleanup-summary
        output: hashesCountsSummariesEvidenceAndAuditIdsOnly
        cleanupCompletedProjectionOnly: true
    forbidden:
      - dashboardWriteUi
      - cliWorktreeCleanupExecuteCommand
      - rawWorktreePathPersistence
      - rawGitCommandPersistence
      - arbitraryGitCommand
      - genericShell
      - gitPush
      - openPullRequest
      - forceWorktreeRemove
      - filesystemDeleteFallback
      - browserAutomation
      - electronAutomation
      - mcpWriteTool
  m6d.worktree-read-only-control-ux:
    risk: medium
    trigger:
      type: manual
      entrypoint: apps/dashboard apps/cli
      localControlRequired: false
    chain:
      - phase: dashboard-read-only-view
        route: '#/worktrees'
        reads:
          - GET /api/worktrees/dry-runs
          - GET /api/worktrees/approvals
          - GET /api/worktrees/runs
          - GET /api/worktrees/cleanup/dry-runs
          - GET /api/worktrees/cleanup/approvals
          - GET /api/worktrees/cleanup/runs
        output: hashesCountsSummariesEvidenceAndAuditIdsOnly
        localControlTokenUsed: false
      - phase: cli-read-only-commands
        commands:
          - codexhub worktrees dry-runs list
          - codexhub worktrees approvals list
          - codexhub worktrees runs list
          - codexhub worktrees runs show
          - codexhub worktrees cleanup dry-runs list
          - codexhub worktrees cleanup approvals list
          - codexhub worktrees cleanup runs list
          - codexhub worktrees cleanup runs show
        methodsAllowed:
          - GET
        localControlTokenRead: false
      - phase: generic-run-summary
        command: codexhub runs list/show
        includes:
          - worktree_run
          - worktree_cleanup_run
    forbidden:
      - dashboardWriteUi
      - dashboardApprovalButton
      - dashboardExecuteButton
      - cliWorktreeExecuteCommand
      - cliWorktreeCleanupExecuteCommand
      - localControlTokenInDashboard
      - localControlTokenReadByReadOnlyCli
      - adapterExecuteFromUiOrCli
      - rawWorktreePathRendering
      - rawGitCommandRendering
      - rawDiffRendering
      - gitPush
      - openPullRequest
  m7d.policy-telemetry-read-only-ux:
    risk: medium
    trigger:
      type: manual
      entrypoint: apps/dashboard apps/cli
      localControlRequired: false
    chain:
      - phase: dashboard-read-only-view
        route: '#/policy-telemetry'
        reads:
          - policy-backend manifest metadata
          - telemetry manifest metadata
          - local projection summary metadata
        output: hashesCountsStatusesSummariesOnly
        localControlTokenUsed: false
      - phase: cli-read-only-commands
        commands:
          - codexhub policy-backend status
          - codexhub policy-backend plan
          - codexhub telemetry status
          - codexhub telemetry projection show
        localControlTokenRead: false
        supervisorPostAllowed: false
      - phase: generic-run-summary
        command: codexhub runs list/show
        includes:
          - policy_backend_projection
          - telemetry_projection
    forbidden:
      - dashboardWriteUi
      - dashboardApprovalButton
      - dashboardExecuteButton
      - cliPolicyBackendExecuteCommand
      - cliTelemetryExportCommand
      - localControlTokenInDashboard
      - localControlTokenReadByReadOnlyCli
      - adapterExecuteFromUiOrCli
      - rawPolicySourceRendering
      - rawTracePayloadRendering
      - otlpNetworkExport
      - opaRuntime
      - cedarRuntime
  m8a.release-candidate-hardening-baseline:
    risk: high
    trigger:
      type: manual
      entrypoint: docs tools
      localControlRequired: false
    chain:
      - phase: capability-matrix
        document: docs/releases/m8a-release-candidate-baseline.md
        covers:
          - codex-cli
          - nx-affected
          - mcp-server
          - playwright-observer
          - electron-cdp
          - worktree-manager
          - policy-backend
          - otel-adapter
      - phase: threat-model
        document: docs/threat-model/m8a-release-candidate-threat-model.md
        validates:
          - authorityProviderSeparation
          - localControlBoundary
          - metadataOnlyEvidence
          - noRuntimeExpansion
      - phase: operator-runbook
        documents:
          - docs/runbooks/m8a-release-candidate-operator-runbook.md
          - docs/runbooks/m8a-release-candidate-rollback.md
          - docs/checklists/m8a-operator-readiness-checklist.md
        validates:
          - releaseGateCommands
          - rollbackControls
          - operatorStopConditions
      - phase: health-registration
        tool: tools/scaffold-health.ts
        validates:
          - releaseDocsPresent
          - threatModelPresent
          - runbookPresent
          - rollbackPresent
          - operatorChecklistPresent
      - phase: release-verification
        commands:
          - pnpm scaffold:health
          - pnpm audit:boundaries
          - pnpm audit:sqlite-isolation
          - pnpm audit:no-live-automation
          - pnpm audit:skills
          - pnpm verify:foundation
          - git diff --check
    forbidden:
      - newSupervisorRoute
      - newDashboardWriteUi
      - newCliWriteCommand
      - newMcpTool
      - adapterExecuteFromUiOrCli
      - newProcessBoundary
      - newNetworkBoundary
      - newWebSocketBoundary
      - browserAct
      - electronMainInspector
      - runtimeEvaluate
      - gitPush
      - openPullRequest
      - opaRuntime
      - cedarRuntime
      - openTelemetrySdk
      - otlpNetworkExport
  m8b.unified-governance-projection:
    risk: medium
    trigger:
      type: manual
      entrypoint: packages/governance-projection-kernel apps/dashboard apps/cli
      localControlRequired: false
    chain:
      - phase: unified-run-index
        package: governance-projection-kernel
        sources:
          - codex
          - verification
          - mcp
          - browser
          - electron
          - worktree
          - policy
          - telemetry
          - orchestrator
        output: idsHashesCountsStatusesSummariesEvidenceAndAuditIdsOnly
      - phase: dashboard-read-only-view
        route: '#/governance'
        localControlTokenUsed: false
        supervisorPostAllowed: false
      - phase: cli-read-only-commands
        commands:
          - codexhub governance runs list
          - codexhub governance runs show
          - codexhub governance evidence bundle
          - codexhub governance audit chain
        localControlTokenRead: false
        supervisorPostAllowed: false
    forbidden:
      - newSupervisorRoute
      - dashboardWriteUi
      - cliWriteCommand
      - localControlTokenInDashboard
      - localControlTokenReadByReadOnlyCli
      - adapterExecuteFromUiOrCli
      - rawPromptRendering
      - rawStdoutRendering
      - rawStderrRendering
      - rawDiffRendering
      - rawTracePayloadRendering
      - rawPathRendering
  m8c.operator-readiness-config-doctor:
    risk: medium
    trigger:
      type: manual
      entrypoint: packages/operator-readiness-kernel apps/dashboard apps/cli
      localControlRequired: false
    chain:
      - phase: readiness-report
        package: operator-readiness-kernel
        checks:
          - integrationEnabledState
          - envFlagConfiguredState
          - localTokenConfiguredState
          - storeAvailability
          - processBoundaryAllowlist
          - policyRiskIntegrationConfigHash
        output: configuredMissingHashesAndSummariesOnly
      - phase: dashboard-read-only-view
        route: '#/readiness'
        localControlTokenUsed: false
        supervisorPostAllowed: false
      - phase: cli-read-only-commands
        commands:
          - codexhub doctor
          - codexhub doctor integration
        localControlTokenRead: false
        supervisorPostAllowed: false
    forbidden:
      - secretValueRendering
      - rawEnvValueRendering
      - localControlTokenRendering
      - newSupervisorRoute
      - dashboardWriteUi
      - cliWriteCommand
      - adapterExecuteFromUiOrCli
  m8d.golden-path-rehearsal:
    risk: medium
    trigger:
      type: manual
      entrypoint: packages/orchestrator-kernel apps/cli
      localControlRequired: false
    chain:
      - phase: fixture-development-request
        source: orchestrator-kernel
      - phase: fixture-worktree
        processBoundaryInvoked: false
        externalProcessStarted: false
      - phase: fixture-codex
        processBoundaryInvoked: false
        externalProcessStarted: false
      - phase: fixture-nx
        processBoundaryInvoked: false
        externalProcessStarted: false
      - phase: pr-draft-metadata
        rawBodyStored: false
      - phase: evidence-audit-bundle
        output: idsHashesCountsStatusesSummariesOnly
      - phase: telemetry-projection
        evidenceAuditAuthoritative: false
    forbidden:
      - realCodexProcess
      - realNxProcess
      - realGitProcess
      - newProcessBoundary
      - newSupervisorRoute
      - dashboardWriteUi
      - cliWriteCommand
      - push
      - openPullRequest
  m8_5.final-release-candidate-audit:
    risk: medium
    trigger:
      type: manual
      entrypoint: docs tools
      localControlRequired: false
    chain:
      - phase: release-candidate-documentation
        documents:
          - docs/releases/m8-release-candidate.md
          - docs/reviews/m8-final-release-audit.md
      - phase: scaffold-health-registration
        tool: tools/scaffold-health.ts
        validates:
          - finalReleaseDocumentPresent
          - finalAuditDocumentPresent
      - phase: final-verification
        commands:
          - pnpm scaffold:health
          - pnpm audit:boundaries
          - pnpm audit:sqlite-isolation
          - pnpm audit:no-live-automation
          - pnpm audit:skills
          - pnpm verify:foundation
          - git diff --check
          - git status --short --branch
    forbidden:
      - newSupervisorRoute
      - newDashboardWriteUi
      - newCliWriteCommand
      - newMcpTool
      - newProcessBoundary
      - newNetworkBoundary
      - newWebSocketBoundary
      - adapterExecuteFromUiOrCli
  m10a.operator-pilot-productization:
    risk: medium
    trigger:
      type: manual
      entrypoint: packages/operator-readiness-kernel apps/dashboard apps/cli docs tools
      localControlRequired: false
    chain:
      - phase: contracts
        package: contracts
        models:
          - M10PilotChecklist
          - M10PilotOperatorStep
          - M10PilotRunbookSummary
        output: idsHashesCountsStatusesSummariesOnly
      - phase: readiness-helper
        package: operator-readiness-kernel
        summarizes:
          - integration state
          - required env flags
          - approval inbox state
          - governance run state
          - known blockers
      - phase: dashboard-read-only-view
        route: '#/pilot'
        localControlTokenUsed: false
        supervisorPostAllowed: false
      - phase: cli-read-only-commands
        commands:
          - codexhub pilot m10 checklist
          - codexhub pilot m10 runbook
        localControlTokenRead: false
        supervisorPostAllowed: false
      - phase: operator-docs
        documents:
          - docs/runbooks/m10-local-pilot-operator-runbook.md
          - docs/checklists/m10-local-pilot-checklist.md
          - docs/releases/m10a-pilot-productization.md
    forbidden:
      - newSupervisorRoute
      - dashboardWriteUi
      - cliWriteCommand
      - localControlTokenInDashboard
      - localControlTokenReadByReadOnlyCli
      - adapterExecuteFromUiOrCli
      - newProcessBoundary
      - newNetworkBoundary
      - realPilotExecution
      - gitPush
      - openPullRequest
  m11a.production-pilot-narrow-path:
    risk: high
    trigger:
      type: supervisor-local-control
      entrypoint: /api/pilots/m11/local-runs
      localControlRequired: true
      trustedLoopbackOriginRequired: true
    chain:
      - phase: readiness-preflight
        package: orchestrator-kernel
        validates:
          - storeAvailable
          - worktreeApprovalStoreResolved
          - codexReadOnlyDryRunOnly
          - nxAffectedVerificationOnly
      - phase: controlled-worktree
        package: worktree-manager
        boundary: existing-controlled-git-worktree
        approvalRequired: true
        allowedRoot: ../CodexHub-worktrees
      - phase: codex-read-only-dry-run
        package: codex-exec-adapter
        workspaceWriteAllowed: false
        rawPromptStored: false
      - phase: nx-verification
        package: nx-verification-adapter
        allowedTargets:
          - lint
          - test
          - build
      - phase: projection
        packages:
          - governance-projection-kernel
          - evidence-kernel
        output: ids-hashes-counts-statuses-summaries
      - phase: read-only-ux
        apps:
          - dashboard
          - cli
        dashboardRoute: '#/pilot'
        cliCommands:
          - codexhub pilot m11 readiness
          - codexhub pilot m11 runs list
          - codexhub pilot m11 runs show
        supervisorPostAllowedFromUx: false
    forbidden:
      - newProcessBoundary
      - newBrowserBoundary
      - newElectronBoundary
      - newMcpExecution
      - codexWorkspaceWrite
      - patchGeneration
      - gitPush
      - openPullRequest
      - requestBodyApprovalArtifactTrusted
      - requestBodyExecutionAuthorityTrusted
      - browserAutomation
      - electronAutomation
      - mcpRuntime
  m11b.pilot-operator-enablement:
    risk: high
    trigger:
      type: read-only-operator
      entrypoint: packages/operator-readiness-kernel apps/dashboard apps/cli docs tools
      localControlRequired: false
    chain:
      - phase: enablement-contracts
        package: contracts
        models:
          - M11PilotEnablementStep
          - M11PilotEnablementChecklist
          - M11PilotEnablementRunbookSummary
        output: ids-hashes-counts-statuses-summaries
      - phase: readiness-helper
        package: operator-readiness-kernel
        validates:
          - m11PilotEnvFlag
          - worktreeManagerEnvFlag
          - storeAvailability
          - approvalInboxMetadata
          - governanceRunMetadata
          - cleanupHandoffMetadata
      - phase: dashboard-read-only-view
        route: '#/pilot'
        sections:
          - M11 Safe-Enable Checklist
          - M11 Operator Handoff
        supervisorPostAllowed: false
      - phase: cli-read-only-view
        commands:
