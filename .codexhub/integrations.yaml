      releaseDoc: docs/releases/m15-github-provider-results.md
      reviewDoc: docs/reviews/m15-github-provider-hardening-review.md
      runbook: docs/runbooks/m15-github-provider-operator-runbook.md
      remoteMutationAuditEnabled: true
      allowedGithubHttpBoundaryCount: 1
      uiCliReadOnlyRegressionTests: true
    mergeControlPlane:
      stage: m38
      helper: executeGithubMerge
      supervisorControlPlaneAdded: true
      routePrefix: /api/github/merges
      enabledByDefault: false
      requiredEnvFlags:
        - CODEXHUB_GITHUB_PROVIDER_ENABLED
        - CODEXHUB_GITHUB_MERGE_ENABLED
      tokenEnv: CODEXHUB_GITHUB_TOKEN
      requiresTwoApprovals: true
      approverHashesMustDiffer: true
      allowedStrategies:
