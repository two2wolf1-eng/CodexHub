      requiredEnvFlags:
        - CODEXHUB_GITHUB_PROVIDER_ENABLED
        - CODEXHUB_GITHUB_PR_LIFECYCLE_OBSERVER_ENABLED
      tokenEnv: CODEXHUB_GITHUB_TOKEN
      persistedApprovalRequired: true
      executionAuthorityRequired: true
      hashBoundRemoteRefsRequired: true
      approvalConsumedAfterNetworkBoundary: true
      fixedGetOnly: true
      allowedRequests:
        - GET /repos/{owner}/{repo}
        - GET /repos/{owner}/{repo}/pulls/{number}
        - GET /repos/{owner}/{repo}/pulls?state=open
        - GET /repos/{owner}/{repo}/git/ref/heads/{branch}
        - GET /repos/{owner}/{repo}/commits/{sha}/status
        - GET /repos/{owner}/{repo}/commits/{sha}/check-runs
      rawCheckLogsStored: false
      rawCommentsStored: false
      rawReviewBodiesStored: false
      rawUrlsStored: false
      rawResponseBodyStored: false
      output: ids-hashes-counts-statuses-evidence-audit-boundaries
    prLifecycleReadOnlyUx:
      stage: m19d
      dashboardRoute: "#/github"
      genericRunsProjection: github_pr_lifecycle_run
      supervisorMethods: GET-only
      localControlKeyRead: false
      adapterExecuteAllowed: false
      output: ids-hashes-counts-statuses-evidence-audit-boundaries
    prLifecycleAcceptanceRehearsal:
      stage: m19e
      helper: runGithubPrLifecycleAcceptanceRehearsal
      dashboardRoute: "#/github"
      fixtureOnly: true
