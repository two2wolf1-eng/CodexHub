    remoteSupersedeAcceptanceRehearsal:
      stage: m21b
      helper: runRemoteSupersedeAcceptanceRehearsal
      dashboardRoute: "#/github"
      fixtureOnly: true
      scenarios:
        - all-pass
        - no-successor
        - old-pr-open
        - old-branch-live
        - checks-pending
        - superseded-source-missing
      networkBoundaryInvoked: false
      processBoundaryInvoked: false
      externalProcessStarted: false
      supervisorPostAllowed: false
      localControlKeyRead: false
      adapterExecuteAllowed: false
    remoteCleanupControlPlane:
      stage: m22
      helper: executeGithubRemoteCleanup
      routePrefix: /api/github/remote-cleanups
      enabledByDefault: false
      requiredEnvFlags:
        - CODEXHUB_GITHUB_PROVIDER_ENABLED
        - CODEXHUB_GITHUB_REMOTE_CLEANUP_ENABLED
      tokenEnv: CODEXHUB_GITHUB_TOKEN
      persistedApprovalRequired: true
      executionAuthorityRequired: true
      hashBoundRemoteRefsRequired: true
      oldBranchPrefixRequired: codexhub/
      successorMetadataRequired: true
      sourceMustBeCodexHubBranchPublishRun: true
      sourcePrMustBeDraftOrSuperseded: true
      approvalConsumedAfterNetworkWriteBoundary: true
      completedRunIsRemoteWrite: true
      noPush: true
      noUpdateRef: true
      noForce: true
      noMerge: true
      noComments: true
      noLabels: true
      noReviewers: true
      noRelease: true
      noDeployment: true
      output: ids-hashes-counts-statuses-evidence-audit-boundaries
    remoteCleanupReadOnlyUx:
      stage: m22c
      dashboardRoute: "#/github"
      genericRunsProjection: github_remote_cleanup_run
      supervisorMethods: GET-only
      localControlKeyRead: false
      adapterExecuteAllowed: false
    remoteCleanupAcceptanceRehearsal:
      stage: m22d
      helper: runGithubRemoteCleanupAcceptanceRehearsal
      dashboardRoute: "#/github"
