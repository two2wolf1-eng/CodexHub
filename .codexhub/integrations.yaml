version: 1
mode: foundation-readiness
authority:
  governanceCoreAuthoritative: true
  capabilityProvidersAuthoritative: false
  adapterExecuteOnlyViaWorkflowKernel: true
  capabilityAdapterKernelRequired: true
  adapterKernelPackage: capability-adapter-kernel
  adapterKernelValidates:
    - manifest
    - dry-run-plan
    - execution-envelope
    - evidence-audit-references
integrations:
  codex-cli:
    enabled: false
    plannedAdapter: codex-exec-adapter
    provider: official-cli
    providerType: external-process
    processBoundary: true
    argsAllowlist:
      - exec
      - --json
      - --sandbox
      - --approval-mode
    forbiddenArgs:
      - --danger-full-access
      - --full-auto
    defaultRisk: medium
    defaultActionMode: dry-run
    approvalRequiredForRealExecution: true
    evidence:
      stdout: hash-only
      stderr: hash-only
      jsonl: redacted
      bodyStorage: hash-only
  nx-affected:
    enabled: false
    plannedAdapter: nx-verification-adapter
    provider: nx
    providerType: external-process
    processBoundary: true
    allowedTargets:
      - lint
      - test
      - build
    defaultRisk: low
    defaultActionMode: read
    arbitraryShellAllowed: false
    dryRunUsesAffectedShowProjects: true
    affectedDryRunFlagAllowed: false
    evidence:
      output: hash-only
  mcp-server:
    enabled: true
    adapter: codexhub-mcp-server
    provider: official-sdk
    providerType: official-sdk
    sdkPackage: '@modelcontextprotocol/sdk'
    sdkVersion: 1.29.0
    defaultToolsMode: read-only
    stdioDefault: true
    httpTransport:
      enabled: true
      optInByCommandOrEnv: true
      bindHost: 127.0.0.1
      defaultPort: 3335
      endpoint: /mcp
      healthEndpoint: /health
      localControlRequired: true
      wildcardCorsAllowed: false
      trustedOriginsLoopbackOnly: true
      hostLoopbackOnly: true
      stateless: true
      sseEnabled: false
    writeToolsRequireApproval: true
    toolsMustDeclareRiskActionEvidenceApproval: true
    storeRequiredForToolSuccess: true
    unauditedSuccessAllowed: false
    firstToolsReadOnly:
      - codexhub.getArchitectureMap
      - codexhub.getPolicySummary
      - codexhub.getRiskMatrix
      - codexhub.getEvidenceSummary
      - codexhub.getOpenDevelopmentRequests
      - codexhub.getAffectedProjectsDryRun
      - codexhub.readObservationSnapshot
  playwright-observer:
    enabled: false
    plannedAdapter: playwright-observer-adapter
    provider: playwright
    providerType: open-source
    mode: read-only
    stage: m4c-supervisor-gated-control-plane
    fixtureRunnerOnly: false
    controlledLocalBrowserRunner: true
    supervisorControlPlane:
      enabledByDefault: false
      explicitEnableRequired: true
      enablementEnv: CODEXHUB_PLAYWRIGHT_OBSERVER_ENABLED
      localControlRequiredForPost: true
      dryRunPersistedBySupervisor: true
      persistedApprovalRequired: true
      requestBodyApprovalArtifactTrusted: false
      executionAuthorityBodyTrusted: false
      readOnlyDashboardUx: true
      cliExecuteCommandEnabled: false
      rawTargetUrlStorage: forbidden
    realUserProfileConnectionEnabled: false
    externalProcessBoundary: true
    processBoundaryRequiresApproval: true
    allowedTargets:
      - about:blank
      - data:text/html
      - http://localhost
      - http://127.0.0.1
      - http://[::1]
    profileProbeEnabled: false
    rawProfilePathStorage: forbidden
    outputBodyStorage: hash-only
    clickTypeSubmitAllowed: false
    screenshotRequiresApproval: true
    networkBodyStorage: forbidden
    forbiddenByDefault:
      - click
      - type
      - submit
      - cookieExtraction
      - tokenExtraction
      - localStorageDump
      - sessionStorageDump
  electron-cdp:
    enabled: false
    adapter: electron-cdp-adapter
    provider: electron-cdp-controlled-events
    providerType: builtin
    mode: read-only
    stage: m5c-supervisor-gated-controlled-events
    fixtureRunnerOnly: false
    controlledLocalHttpRunner: true
    controlledWebSocketEventRunner: true
    supervisorControlPlane:
      enabledByDefault: false
      explicitEnableRequired: true
      enablementEnv: CODEXHUB_ELECTRON_CDP_OBSERVER_ENABLED
      eventsEnablementEnv: CODEXHUB_ELECTRON_CDP_EVENTS_ENABLED
      localControlRequiredForPost: true
      dryRunPersistedBySupervisor: true
      persistedApprovalRequired: true
      requestBodyApprovalArtifactTrusted: false
      executionAuthorityBodyTrusted: false
      transientEndpointInputOnly: true
      endpointHashBindingRequired: true
      readOnlyDashboardUx: true
      cliExecuteCommandEnabled: false
    realElectronConnectionEnabled: false
    cdpHttpClientEnabled: true
    cdpHttpBoundary:
      allowedMethods:
        - GET
      allowedEndpoints:
        - /json/version
        - /json/list
      loopbackOnly: true
      storesRawHostPort: false
      storesRawResponseBody: false
      storesWebSocketDebuggerUrl: false
      approvalRequired: true
    cdpWebSocketClientEnabled: true
    cdpWebSocketEvents:
      enabledByDefault: false
      explicitEnableRequired: true
      targetHashBindingRequired: true
      loopbackOnly: true
      maxObservationWindowMs: 30000
      defaultObservationWindowMs: 5000
      storesRawWebSocketUrl: false
      storesRawEventPayload: false
      approvalRequired: true
      allowedCommands:
        - Log.enable
        - Runtime.enable
        - Network.enable
    processDiscoveryEnabled: false
    processBoundary: false
    externalProcessBoundary: false
    processBoundaryAllowlistChangeRequired: false
    rawExecutablePathStorage: forbidden
    rawCommandLineStorage: forbidden
    rawEndpointStorage: forbidden
    outputBodyStorage: hash-only
    mainInspectorDefault: disabled
    mainInspectorConnectionAllowed: false
    runtimeEvaluateDefault: forbidden
    runtimeEvaluateAllowed: false
    genericCommandPassthroughAllowed: false
    domMutationAllowed: false
    clickTypeAllowed: false
    domSnapshotRequiresApproval: true
    screenshotRequiresApproval: true
    networkBodyStorage: forbidden
    loopbackOnlyRequired: true
    userEnabledRequired: true
    commandAllowlist:
      - Browser.getVersion
      - Target.getTargets
      - Log.enable
      - Runtime.enable
      - Network.enable
  worktree-manager:
    enabled: false
    adapter: worktree-manager
    provider: builtin
    mode: controlled-git-worktree
    stage: m6d-read-only-control-ux
    defaultWorktreeRoot: ../CodexHub-worktrees
    defaultActionMode: dry-run
    defaultRisk: high
    processBoundary: true
    externalProcessBoundary: true
    processBoundaryRequiresApproval: true
    realGitBoundaryEnabled: false
    enablementEnv: CODEXHUB_WORKTREE_MANAGER_ENABLED
    fixtureRunnerOnly: false
    controlledGitRunner: true
    pushAllowed: false
    openPullRequestAllowed: false
    cleanupDeleteAllowed: true
    cleanupDeleteRequiresApproval: true
    cleanupForceAllowed: false
    cleanupFilesystemDeleteFallbackAllowed: false
    cleanupDeferredToM6c: false
    cleanupEnablementEnv: CODEXHUB_WORKTREE_CLEANUP_ENABLED
    supervisorControlPlane:
      enabledByDefault: false
      explicitEnableRequired: true
      localControlRequiredForPost: true
      dryRunPersistedBySupervisor: true
      persistedApprovalRequired: true
      requestBodyApprovalArtifactTrusted: false
      executionAuthorityBodyTrusted: false
      transientPathInputOnly: true
      pathAndRefHashBindingRequired: true
    readOnlyUx:
      dashboardRoute: '#/worktrees'
      dashboardPostAllowed: false
      dashboardLocalControlTokenAllowed: false
      cliPostAllowed: false
      cliLocalControlTokenReadAllowed: false
      adapterExecuteFromUiOrCliAllowed: false
      metadataOnly: true
    evidence:
      worktreePlan: hash-only
      changedFiles: metadata-only
      diff: hash-only
      prDraft: hash-only
      releaseAuditDraft: hash-only
      cleanupPlan: hash-only
      cleanupStatus: hash-only
    storage:
      rawWorktreePath: forbidden
      rawDiffBody: forbidden
      rawPullRequestBody: forbidden
      rawCommandBody: forbidden
    rules:
      siblingRootDefault: true
      repoNestedWorktreeForbidden: true
      slugSanitizationRequired: true
      realGitWriteRequiresApproval: true
      allowedGitCommands:
        - rev-parse --show-toplevel
        - worktree add --detach
        - worktree list --porcelain
        - status --porcelain --untracked-files=normal
        - worktree remove
        - diff --name-only --no-ext-diff
        - diff --numstat --no-ext-diff
      arbitraryGitCommandAllowed: false
      genericShellAllowed: false
      worktreeRemoveAllowed: true
      worktreeRemoveForceAllowed: false
  github-provider:
    enabled: false
    adapter: github-provider-adapter
    provider: github
    providerType: external-network
    mode: governed-remote-lifecycle
    stage: m22-remote-cleanup-control-plane
    defaultActionMode: read
    defaultRisk: high
    processBoundary: false
    externalProcessBoundary: false
    networkBoundary: controlled-github-http-disabled-by-default
    token:
      env: CODEXHUB_GITHUB_TOKEN
      output: configured-hash-only
      valueStorage: forbidden
    defaultRemoteTarget:
      configured: true
      ownerHash: sha256:c106675fbc8f5a6b26da49c4753904eb07422efa446ec9b97752077a8e41d0bc
      repoHash: sha256:6561a73947ca1e67588bd91b60a984bc7336d55961edea5fdfb459ffbe75efaf
      remoteUrlHash: sha256:71582f3e69af12e43f27ef2a597f39db5a3dbc2a8f07a3fbb23e5dce0db3d5f2
      localGitRemoteName: origin
      rawOwnerStorage: forbidden
      rawRepoStorage: forbidden
      rawUrlStorage: forbidden
      remoteRepositoryEmptyRequiresApprovedObservation: true
    allowedHost: api.github.com
    productDefaultEnabled: false
    metadataReadEnabled: false
    draftPrCreationEnabled: false
    draftPrPlanningEnabled: true
    branchPublishPlanningEnabled: true
    branchPublishCreationEnabled: false
    prLifecycleObservationEnabled: false
    remoteSupersedeProjectionEnabled: true
    remoteCleanupEnabled: false
    enablementEnv: CODEXHUB_GITHUB_PROVIDER_ENABLED
    draftPrEnablementEnv: CODEXHUB_GITHUB_DRAFT_PR_ENABLED
    branchPublishEnablementEnv: CODEXHUB_GITHUB_BRANCH_PUBLISH_ENABLED
    prLifecycleObservationEnablementEnv: CODEXHUB_GITHUB_PR_LIFECYCLE_OBSERVER_ENABLED
    remoteCleanupEnablementEnv: CODEXHUB_GITHUB_REMOTE_CLEANUP_ENABLED
    supervisorControlPlane:
      enabledByDefault: false
      localControlRequiredForPost: true
      trustedLoopbackOriginRequired: true
      dryRunPersistedBySupervisor: true
      persistedApprovalRequired: true
      requestBodyApprovalArtifactTrusted: false
      executionAuthorityBodyTrusted: false
      hashBoundRuntimeInputRequired: true
      metadataRoutes:
        - POST /api/github/metadata/dry-runs
        - GET /api/github/metadata/dry-runs
        - POST /api/github/metadata/approval-requests
        - POST /api/github/metadata/manual-approvals
        - GET /api/github/metadata/approvals
        - POST /api/github/metadata/runs
        - GET /api/github/metadata/runs
        - GET /api/github/metadata/runs/:id
      branchPublishRoutes:
        - POST /api/github/branch-publishes/dry-runs
        - GET /api/github/branch-publishes/dry-runs
        - POST /api/github/branch-publishes/approval-requests
        - POST /api/github/branch-publishes/manual-approvals
        - GET /api/github/branch-publishes/approvals
        - POST /api/github/branch-publishes/runs
        - GET /api/github/branch-publishes/runs
        - GET /api/github/branch-publishes/runs/:id
      prLifecycleRoutes:
        - POST /api/github/pr-lifecycle/dry-runs
        - GET /api/github/pr-lifecycle/dry-runs
        - POST /api/github/pr-lifecycle/approval-requests
        - POST /api/github/pr-lifecycle/manual-approvals
        - GET /api/github/pr-lifecycle/approvals
        - POST /api/github/pr-lifecycle/runs
        - GET /api/github/pr-lifecycle/runs
        - GET /api/github/pr-lifecycle/runs/:id
      remoteSupersedeRoutes:
        - GET /api/github/supersedes/dry-runs
        - GET /api/github/supersedes/runs
        - GET /api/github/supersedes/runs/:id
      remoteCleanupRoutes:
        - POST /api/github/remote-cleanups/dry-runs
        - GET /api/github/remote-cleanups/dry-runs
        - POST /api/github/remote-cleanups/approval-requests
        - POST /api/github/remote-cleanups/manual-approvals
        - GET /api/github/remote-cleanups/approvals
        - POST /api/github/remote-cleanups/runs
        - GET /api/github/remote-cleanups/runs
        - GET /api/github/remote-cleanups/runs/:id
    readOnlyUx:
      stage: m19d
      dashboardRoute: "#/github"
      cliCommands:
        - codexhub github status
        - codexhub github metadata dry-runs list
        - codexhub github metadata runs list
        - codexhub github metadata runs show <runId>
        - codexhub github draft-prs dry-runs list
        - codexhub github draft-prs approvals list
        - codexhub github draft-prs runs list
        - codexhub github draft-prs runs show <runId>
        - codexhub github draft-prs rehearse --fixture --scenario <name>
        - codexhub github branch-publishes dry-runs list
        - codexhub github branch-publishes approvals list
        - codexhub github branch-publishes runs list
        - codexhub github branch-publishes runs show <runId>
        - codexhub github branch-publishes rehearse --fixture --scenario <name>
        - codexhub github publish-draft-pr-chains dry-runs list
        - codexhub github publish-draft-pr-chains runs list
        - codexhub github publish-draft-pr-chains runs show <runId>
        - codexhub github publish-draft-pr-chains rehearse --fixture --scenario <name>
        - codexhub github pr-lifecycle dry-runs list
        - codexhub github pr-lifecycle approvals list
        - codexhub github pr-lifecycle runs list
        - codexhub github pr-lifecycle runs show <runId>
        - codexhub github pr-lifecycle rehearse --fixture --scenario <name>
        - codexhub github supersedes dry-runs list
        - codexhub github supersedes runs list
        - codexhub github supersedes runs show <runId>
        - codexhub github supersedes rehearse --fixture --scenario <name>
        - codexhub github remote-cleanups dry-runs list
        - codexhub github remote-cleanups approvals list
        - codexhub github remote-cleanups runs list
        - codexhub github remote-cleanups runs show <runId>
        - codexhub github remote-cleanups rehearse --fixture --scenario <name>
      localControlRequired: false
      supervisorPostAllowed: false
      adapterExecuteAllowed: false
      credentialOutput: configured-hash-only
      publicOutput: ids-hashes-counts-statuses-evidence-audit-boundaries
    hardening:
      stage: m15.5
      releaseDoc: docs/releases/m15-github-provider-results.md
      reviewDoc: docs/reviews/m15-github-provider-hardening-review.md
      runbook: docs/runbooks/m15-github-provider-operator-runbook.md
      remoteMutationAuditEnabled: true
      allowedGithubHttpBoundaryCount: 1
      uiCliReadOnlyRegressionTests: true
    draftPrPlanning:
      stage: m16a
      helper: createGithubDraftPrPlan
      sourceKinds:
        - local_rc_readiness
        - review_package
      existingHeadBranchRequired: true
      existingOpenPrBlocks: true
      titleStorage: hash-only
      bodyStorage: hash-only
      networkBoundaryAdded: false
      supervisorRouteAdded: false
      authorityGrantedByPlan: false
      approvalRequiredForCreation: true
      output: ids-hashes-counts-statuses-summaries
    draftPrCreation:
      stage: m16b
      helper: executeGithubDraftPrCreation
      supervisorControlPlaneAdded: true
      routePrefix: /api/github/draft-prs
      enabledByDefault: false
      requiredEnvFlags:
        - CODEXHUB_GITHUB_PROVIDER_ENABLED
        - CODEXHUB_GITHUB_DRAFT_PR_ENABLED
      tokenEnv: CODEXHUB_GITHUB_TOKEN
      persistedApprovalRequired: true
      executionAuthorityRequired: true
      hashBoundRemoteRefsRequired: true
      existingRemoteHeadBranchRequired: true
      existingOpenPrBlocks: true
      approvalConsumedAfterNetworkBoundary: true
      completedRunIsRemoteWrite: true
      noPush: true
      noCreateRef: true
      noMerge: true
      output: ids-hashes-counts-statuses-evidence-audit-boundaries
    draftPrReadOnlyUx:
      stage: m16c
      dashboardRoute: "#/github"
      genericRunsProjection: github_draft_pr_run
      supervisorMethods: GET-only
      localControlKeyRead: false
      adapterExecuteAllowed: false
      output: ids-hashes-counts-statuses-evidence-audit-boundaries
    draftPrAcceptanceRehearsal:
      stage: m16d
      helper: runGithubDraftPrAcceptanceRehearsal
      dashboardRoute: "#/github"
      fixtureOnly: true
      scenarios:
        - all-pass
        - token-missing
        - provider-disabled
        - approval-blocked
        - head-branch-missing
        - existing-pr-found
        - github-post-failed
        - network-timeout
      networkBoundaryInvoked: false
      processBoundaryInvoked: false
      externalProcessStarted: false
      supervisorRouteAdded: false
      supervisorPostAllowed: false
      localControlKeyRead: false
      adapterExecuteAllowed: false
      output: ids-hashes-counts-statuses-summaries
    branchPublishPlanning:
      stage: m17a
      helper: createGithubBranchPublishPlan
      sourceKinds:
        - local_rc_readiness
        - review_package
        - patch_lifecycle
      branchPrefix: codexhub/
      existingBranchBlocks: true
      contentManifestHashOnly: true
      networkBoundaryAdded: false
      supervisorRouteAdded: false
      authorityGrantedByPlan: false
      approvalRequiredForPublish: true
      output: ids-hashes-counts-statuses-summaries
    branchPublishCreation:
      stage: m17b
      helper: executeGithubBranchPublish
      supervisorControlPlaneAdded: true
      routePrefix: /api/github/branch-publishes
      enabledByDefault: false
      requiredEnvFlags:
        - CODEXHUB_GITHUB_PROVIDER_ENABLED
        - CODEXHUB_GITHUB_BRANCH_PUBLISH_ENABLED
      tokenEnv: CODEXHUB_GITHUB_TOKEN
      persistedApprovalRequired: true
      executionAuthorityRequired: true
      hashBoundRemoteRefsRequired: true
      branchPrefixRequired: codexhub/
      existingBranchBlocks: true
      approvalConsumedAfterNetworkWriteBoundary: true
      completedRunIsRemoteWrite: true
      noPush: true
      noUpdateRef: true
      noForce: true
      noOverwriteBranch: true
      noMerge: true
      output: ids-hashes-counts-statuses-evidence-audit-boundaries
      contentRules:
        repoRelativeTextFilesOnly: true
        maxFileCount: 100
        maxFileBytes: 524288
        maxTotalBytes: 5242880
        deletionsAllowed: false
        renamesAllowed: false
        binaryFilesAllowed: false
        symlinksAllowed: false
        rawFileContentStorage: forbidden
    branchPublishReadOnlyUx:
      stage: m17c
      dashboardRoute: "#/github"
      genericRunsProjection: github_branch_publish_run
      supervisorMethods: GET-only
      localControlKeyRead: false
      adapterExecuteAllowed: false
      output: ids-hashes-counts-statuses-evidence-audit-boundaries
    branchPublishAcceptanceRehearsal:
      stage: m17d
      helper: runGithubBranchPublishAcceptanceRehearsal
      dashboardRoute: "#/github"
      fixtureOnly: true
      scenarios:
        - all-pass
        - token-missing
        - provider-disabled
        - approval-blocked
        - branch-exists
        - content-manifest-blocked
        - blob-create-failed
        - tree-create-failed
        - commit-create-failed
        - ref-create-failed
        - network-timeout
      networkBoundaryInvoked: false
      processBoundaryInvoked: false
      externalProcessStarted: false
      supervisorRouteAdded: false
      supervisorPostAllowed: false
      localControlKeyRead: false
      adapterExecuteAllowed: false
      output: ids-hashes-counts-statuses-summaries
    publishDraftPrChainPlanning:
      stage: m18a
      helper: createGithubPublishDraftPrChainPlan
