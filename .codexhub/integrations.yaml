        - github_draft_pr_run
      branchPublishMustCompleteBeforeDraftPr: true
      separatePersistedApprovalsRequired: true
      networkBoundaryAdded: false
      authorityGrantedByPlan: false
      cleanupRecoveryMetadataOnly: true
      output: ids-hashes-counts-statuses-summaries
    publishDraftPrChainProjection:
      stage: m18b
      helper: createGithubPublishDraftPrChainRun
      supervisorControlPlaneAdded: true
      routePrefix: /api/github/publish-draft-pr-chains
      reusesExistingRemoteWriteControlPlanes: true
      directGithubHttpBoundaryInvoked: false
      branchPublishFailureSkipsDraftPr: true
      draftPrFailureAfterBranchCreationRecordsRecoveryOnly: true
      remoteBranchAutoDeleteAllowed: false
      requiredApprovals:
