version: 1
mode: foundation-readiness
authority:
  governanceCoreAuthoritative: true
  capabilityProvidersAuthoritative: false
  adapterExecuteOnlyViaWorkflowKernel: true
  capabilityAdapterKernelRequired: true
  adapterKernelPackage: capability-adapter-kernel
  adapterKernelValidates:
    - manifest
    - dry-run-plan
    - execution-envelope
    - evidence-audit-references
integrations:
  codex-cli:
    enabled: false
    plannedAdapter: codex-exec-adapter
    provider: official-cli
    providerType: external-process
    processBoundary: true
    argsAllowlist:
      - exec
      - --json
      - --sandbox
      - --approval-mode
    forbiddenArgs:
      - --danger-full-access
      - --full-auto
    defaultRisk: medium
    defaultActionMode: dry-run
    approvalRequiredForRealExecution: true
    evidence:
      stdout: hash-only
      stderr: hash-only
      jsonl: redacted
      bodyStorage: hash-only
  nx-affected:
    enabled: false
    plannedAdapter: nx-verification-adapter
    provider: nx
    providerType: external-process
    processBoundary: true
    allowedTargets:
      - lint
      - test
      - build
    defaultRisk: low
    defaultActionMode: read
    arbitraryShellAllowed: false
    dryRunUsesAffectedShowProjects: true
    affectedDryRunFlagAllowed: false
    evidence:
      output: hash-only
  mcp-server:
    enabled: true
    adapter: codexhub-mcp-server
    provider: official-sdk
    providerType: official-sdk
    sdkPackage: '@modelcontextprotocol/sdk'
    sdkVersion: 1.29.0
    defaultToolsMode: read-only
    stdioDefault: true
    httpTransport:
      enabled: true
      optInByCommandOrEnv: true
      bindHost: 127.0.0.1
      defaultPort: 3335
      endpoint: /mcp
      healthEndpoint: /health
      localControlRequired: true
      wildcardCorsAllowed: false
      trustedOriginsLoopbackOnly: true
      hostLoopbackOnly: true
      stateless: true
      sseEnabled: false
    writeToolsRequireApproval: true
    toolsMustDeclareRiskActionEvidenceApproval: true
    storeRequiredForToolSuccess: true
    unauditedSuccessAllowed: false
    firstToolsReadOnly:
      - codexhub.getArchitectureMap
      - codexhub.getPolicySummary
      - codexhub.getRiskMatrix
      - codexhub.getEvidenceSummary
      - codexhub.getOpenDevelopmentRequests
      - codexhub.getAffectedProjectsDryRun
      - codexhub.readObservationSnapshot
  playwright-observer:
    enabled: false
    plannedAdapter: playwright-observer-adapter
    provider: playwright
    providerType: open-source
    mode: read-only
    stage: m4c-supervisor-gated-control-plane
    fixtureRunnerOnly: false
    controlledLocalBrowserRunner: true
    supervisorControlPlane:
      enabledByDefault: false
      explicitEnableRequired: true
      enablementEnv: CODEXHUB_PLAYWRIGHT_OBSERVER_ENABLED
      localControlRequiredForPost: true
      dryRunPersistedBySupervisor: true
      persistedApprovalRequired: true
      requestBodyApprovalArtifactTrusted: false
      executionAuthorityBodyTrusted: false
      readOnlyDashboardUx: true
      cliExecuteCommandEnabled: false
      rawTargetUrlStorage: forbidden
    realUserProfileConnectionEnabled: false
    externalProcessBoundary: true
    processBoundaryRequiresApproval: true
    allowedTargets:
      - about:blank
      - data:text/html
      - http://localhost
      - http://127.0.0.1
      - http://[::1]
    profileProbeEnabled: false
    rawProfilePathStorage: forbidden
    outputBodyStorage: hash-only
    clickTypeSubmitAllowed: false
    screenshotRequiresApproval: true
    networkBodyStorage: forbidden
    forbiddenByDefault:
      - click
      - type
      - submit
      - cookieExtraction
      - tokenExtraction
      - localStorageDump
      - sessionStorageDump
  electron-cdp:
    enabled: false
    adapter: electron-cdp-adapter
    provider: electron-cdp-controlled-events
    providerType: builtin
    mode: read-only
    stage: m5c-supervisor-gated-controlled-events
    fixtureRunnerOnly: false
    controlledLocalHttpRunner: true
    controlledWebSocketEventRunner: true
    supervisorControlPlane:
      enabledByDefault: false
      explicitEnableRequired: true
      enablementEnv: CODEXHUB_ELECTRON_CDP_OBSERVER_ENABLED
      eventsEnablementEnv: CODEXHUB_ELECTRON_CDP_EVENTS_ENABLED
      localControlRequiredForPost: true
      dryRunPersistedBySupervisor: true
      persistedApprovalRequired: true
      requestBodyApprovalArtifactTrusted: false
      executionAuthorityBodyTrusted: false
      transientEndpointInputOnly: true
      endpointHashBindingRequired: true
      readOnlyDashboardUx: true
      cliExecuteCommandEnabled: false
    realElectronConnectionEnabled: false
    cdpHttpClientEnabled: true
    cdpHttpBoundary:
      allowedMethods:
        - GET
      allowedEndpoints:
        - /json/version
        - /json/list
      loopbackOnly: true
      storesRawHostPort: false
      storesRawResponseBody: false
      storesWebSocketDebuggerUrl: false
      approvalRequired: true
    cdpWebSocketClientEnabled: true
    cdpWebSocketEvents:
      enabledByDefault: false
      explicitEnableRequired: true
      targetHashBindingRequired: true
      loopbackOnly: true
      maxObservationWindowMs: 30000
      defaultObservationWindowMs: 5000
      storesRawWebSocketUrl: false
      storesRawEventPayload: false
      approvalRequired: true
      allowedCommands:
        - Log.enable
        - Runtime.enable
        - Network.enable
    processDiscoveryEnabled: false
    processBoundary: false
    externalProcessBoundary: false
    processBoundaryAllowlistChangeRequired: false
    rawExecutablePathStorage: forbidden
    rawCommandLineStorage: forbidden
    rawEndpointStorage: forbidden
    outputBodyStorage: hash-only
    mainInspectorDefault: disabled
    mainInspectorConnectionAllowed: false
    runtimeEvaluateDefault: forbidden
    runtimeEvaluateAllowed: false
    genericCommandPassthroughAllowed: false
    domMutationAllowed: false
    clickTypeAllowed: false
    domSnapshotRequiresApproval: true
    screenshotRequiresApproval: true
    networkBodyStorage: forbidden
    loopbackOnlyRequired: true
    userEnabledRequired: true
    commandAllowlist:
      - Browser.getVersion
      - Target.getTargets
      - Log.enable
      - Runtime.enable
      - Network.enable
  worktree-manager:
    enabled: false
    adapter: worktree-manager
    provider: builtin
    mode: controlled-git-worktree
    stage: m6d-read-only-control-ux
    defaultWorktreeRoot: ../CodexHub-worktrees
    defaultActionMode: dry-run
    defaultRisk: high
    processBoundary: true
    externalProcessBoundary: true
    processBoundaryRequiresApproval: true
    realGitBoundaryEnabled: false
    enablementEnv: CODEXHUB_WORKTREE_MANAGER_ENABLED
    fixtureRunnerOnly: false
    controlledGitRunner: true
    pushAllowed: false
    openPullRequestAllowed: false
    cleanupDeleteAllowed: true
    cleanupDeleteRequiresApproval: true
    cleanupForceAllowed: false
    cleanupFilesystemDeleteFallbackAllowed: false
    cleanupDeferredToM6c: false
    cleanupEnablementEnv: CODEXHUB_WORKTREE_CLEANUP_ENABLED
    supervisorControlPlane:
      enabledByDefault: false
      explicitEnableRequired: true
      localControlRequiredForPost: true
      dryRunPersistedBySupervisor: true
      persistedApprovalRequired: true
      requestBodyApprovalArtifactTrusted: false
      executionAuthorityBodyTrusted: false
      transientPathInputOnly: true
      pathAndRefHashBindingRequired: true
    readOnlyUx:
      dashboardRoute: '#/worktrees'
      dashboardPostAllowed: false
      dashboardLocalControlTokenAllowed: false
      cliPostAllowed: false
      cliLocalControlTokenReadAllowed: false
      adapterExecuteFromUiOrCliAllowed: false
      metadataOnly: true
    evidence:
      worktreePlan: hash-only
      changedFiles: metadata-only
      diff: hash-only
      prDraft: hash-only
      releaseAuditDraft: hash-only
      cleanupPlan: hash-only
      cleanupStatus: hash-only
    storage:
      rawWorktreePath: forbidden
      rawDiffBody: forbidden
      rawPullRequestBody: forbidden
      rawCommandBody: forbidden
    rules:
      siblingRootDefault: true
      repoNestedWorktreeForbidden: true
      slugSanitizationRequired: true
      realGitWriteRequiresApproval: true
      allowedGitCommands:
        - rev-parse --show-toplevel
        - worktree add --detach
        - worktree list --porcelain
        - status --porcelain --untracked-files=normal
        - worktree remove
        - diff --name-only --no-ext-diff
        - diff --numstat --no-ext-diff
      arbitraryGitCommandAllowed: false
      genericShellAllowed: false
      worktreeRemoveAllowed: true
      worktreeRemoveForceAllowed: false
  policy-backend:
    enabled: false
    adapter: policy-backend-adapter
    provider: builtin
    providerType: builtin
    mode: advisory-evaluation
    stage: m7d-read-only-ux
    defaultActionMode: read
    defaultRisk: low
    processBoundary: false
    externalProcessBoundary: false
    networkBoundary: false
    realOpaRuntimeEnabled: false
    realCedarRuntimeEnabled: false
    opaProcessAllowed: false
    cedarRuntimeAllowed: false
    backendKinds:
      - fixture
      - opa-plan-only
      - cedar-plan-only
    fixtureConfig:
      enabled: true
      defaultPath: .codexhub/policy-backend.fixture.json
      rawConfigStorage: forbidden
      rawPathStorage: forbidden
      configHashRequired: true
      ruleCountSummaryOnly: true
    readOnlyUx:
      dashboardRoute: '#/policy-telemetry'
      cliCommands:
        - codexhub policy-backend status
        - codexhub policy-backend plan
      supervisorPostAllowed: false
      localControlTokenRequired: false
    authority:
      backendResultAuthoritative: false
      codexhubPolicyDecisionAuthoritative: true
      normalizedPolicyDecisionRequired: true
    evidence:
      evaluationPlan: hash-only
      rawEvaluationSummary: hash-only
      normalizedDecisionTrace: metadata-only
    storage:
      rawPolicySource: forbidden
      rawRequestBody: forbidden
      rawResponseBody: forbidden
      rawPath: forbidden
    rules:
      backendMayAdviseOnly: true
      requestBodyApprovalArtifactTrusted: false
      noRealPolicyRuntimeInM7b: true
      auditForbidsRealOpaRuntimeInProductionSource: true
      auditForbidsRealCedarRuntimeInProductionSource: true
      auditForbidsBackendAuthorityTransfer: true
      fixtureConfigOutcomeAdvisoryOnly: true
  otel-adapter:
    enabled: false
    adapter: otel-adapter
    provider: builtin
    providerType: builtin
    mode: local-telemetry-projection
    stage: m7d-read-only-ux
    defaultActionMode: read
    defaultRisk: low
    processBoundary: false
    externalProcessBoundary: false
    networkBoundary: false
    openTelemetrySdkEnabled: false
    networkExporterEnabled: false
    exporterKinds:
      - noop
      - fixture
    localProjection:
      enabled: true
      input: existing-metadata-summaries-only
      output: spans-and-export-run-metadata-only
      networkExportAttempted: false
      processBoundaryInvoked: false
      externalProcessStarted: false
    readOnlyUx:
      dashboardRoute: '#/policy-telemetry'
      cliCommands:
        - codexhub telemetry status
        - codexhub telemetry projection show
      supervisorPostAllowed: false
      localControlTokenRequired: false
    evidence:
      tracePlan: hash-only
      spanSummary: metadata-only
      exportSummary: hash-only
    storage:
      rawTracePayload: forbidden
      rawRequestBody: forbidden
      rawResponseBody: forbidden
      rawPath: forbidden
    rules:
      telemetryDoesNotReplaceEvidenceAudit: true
      otlpExportAllowed: false
      noRealTelemetryRuntimeInM7c: true
      auditForbidsOpenTelemetrySdkInProductionSource: true
      auditForbidsOtlpExporterInProductionSource: true
      auditForbidsTelemetryAuthorityTransfer: true
  m11-production-pilot:
    enabled: false
    adapter: orchestrator-kernel
    provider: codexhub-governed-chain
    providerType: builtin
    mode: production-pilot-narrow-path
    stage: m11a-production-pilot-narrow-path
    defaultActionMode: dry-run
    defaultRisk: high
    processBoundary: reuses-existing-boundaries
    externalProcessBoundary: reuses-controlled-worktree-codex-nx
    networkBoundary: false
    enablement:
      requiredEnv:
        - CODEXHUB_M11_PRODUCTION_PILOT_ENABLED
        - CODEXHUB_WORKTREE_MANAGER_ENABLED
      localControlRequired: true
      trustedLoopbackOriginRequired: true
      persistedApprovalRequired: true
      hashBoundRuntimeInputRequired: true
    routes:
      post: /api/pilots/m11/local-runs
      get:
        - /api/pilots/m11/local-runs
        - /api/pilots/m11/local-runs/:id
    codex:
      readOnlyDryRunOnly: true
      workspaceWriteAllowed: false
      rawPromptStorage: forbidden
    worktree:
      allowedRoot: ../CodexHub-worktrees
      repoNestedWorktreeForbidden: true
      approvalRequired: true
    nx:
      allowedTargets:
        - lint
        - test
        - build
    pr:
      patchGenerationAllowed: false
      pushAllowed: false
      openPullRequestAllowed: false
      allowedStatuses:
        - not_ready_no_patch
        - blocked
    storage:
      rawPrompt: forbidden
      rawStdout: forbidden
      rawStderr: forbidden
      rawDiff: forbidden
      rawPath: forbidden
      body: forbidden
    readOnlyUx:
      dashboardRoute: '#/pilot'
      operatorEnablementSections:
        - M11 Safe-Enable Checklist
        - M11 Operator Handoff
        - M11 Recovery Handoff
        - M11 Acceptance Smoke
      cliCommands:
        - codexhub pilot m11 readiness
        - codexhub pilot m11 runs list
        - codexhub pilot m11 runs show
        - codexhub pilot m11 rehearse --fixture --scenario <name>
      supervisorPostAllowed: false
      localControlTokenRequired: false
    m11b:
      stage: pilot-operator-enablement
      checklistHelper: createM11PilotEnablementChecklist
      runbookHelper: createM11PilotEnablementRunbookSummary
      output: ids-hashes-counts-statuses-summaries
      noNewRoutes: true
      noNewExecutionBoundary: true
      dashboardWriteUi: false
      cliWriteCommand: false
    m11d:
      stage: pilot-acceptance-smoke
      smokeHelper: runM11PilotAcceptanceSmoke
      scenarios:
        - all-pass
        - readiness-blocked
        - worktree-approval-blocked
        - worktree-boundary-failed
        - codex-failed
        - nx-failed
      output: ids-hashes-counts-statuses-summaries
      fixtureOnly: true
      processBoundaryInvoked: false
      externalProcessStarted: false
      noNewRoutes: true
      noNewExecutionBoundary: true
      dashboardWriteUi: false
      cliWriteCommand: false
    m11_5:
      stage: pilot-hardening-release-audit
      releaseDocument: docs/releases/m11-production-pilot-results.md
      reviewDocument: docs/reviews/m11-pilot-hardening-review.md
      noNewRoutes: true
      noNewExecutionBoundary: true
      dashboardWriteUi: false
      cliWriteCommand: false
    m11c:
      stage: pilot-failure-recovery-projection
      recoveryHelper: createM11PilotRecoveryProjection
      output: ids-hashes-counts-statuses-summaries-cleanup-handoff
      cleanupHandoffMetadataOnly: true
      noNewRoutes: true
      noNewExecutionBoundary: true
      dashboardWriteUi: false
      cliWriteCommand: false
